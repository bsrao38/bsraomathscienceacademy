bon and its Compounds", "question": "A compound with formula C₂H₄ is likely to undergo addition reactions because it contains:", "options": ["only C−C single bond", "C=C double bond", "only C−H bonds", "an ionic bond"], "answer": 1}, {"id": 20, "subject": "Chemistry", "chapter": "Carbon and its Compounds", "question": "Ethanoic acid reacts with ethanol in the presence of an acid catalyst to form an ester. This reaction is called:", "options": ["saponification", "esterification", "neutralisation", "displacement"], "answer": 1}]};let stage="Foundation — KNOW",current=0,answers=[],time=2700,submitted=false;
