<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B.S. RAO GOLDEN 10™ — Mock Test</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#172033}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;z-index:5}
.brand{font-weight:800}.brand small{display:block;color:#697386;font-weight:500;letter-spacing:1px}
.timer{font-weight:900;font-size:20px;color:#b42318}
main{max-width:850px;margin:auto;padding:22px 4% 50px}
.info{background:#172033;color:#fff;border-radius:16px;padding:18px;margin-bottom:18px}
.info h1{margin:0 0 8px;font-size:22px}.info p{margin:4px 0;color:#d8deea}
.subject-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.tab{border:1px solid #ccd3df;background:#fff;border-radius:20px;padding:8px 13px;font-weight:700}.tab.active{background:#172033;color:#fff}
.card{background:#fff;border:1px solid #e0e4eb;border-radius:18px;padding:22px;margin-bottom:16px}
.meta{color:#697386;font-size:13px;font-weight:700;margin-bottom:10px}
.q{font-size:19px;font-weight:700;line-height:1.45;margin-bottom:18px}
.option{display:block;width:100%;text-align:left;border:1px solid #d5dbe5;background:#fff;border-radius:12px;padding:13px;margin:8px 0;font-size:16px;cursor:pointer}
.option.selected{background:#eaf0ff;border-color:#172033}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:800;cursor:pointer}.prev{background:#e8ecf2}.next,.submit{background:#172033;color:#fff}.submit{display:none;background:#087443}
.progress{height:9px;background:#e0e5ed;border-radius:10px;overflow:hidden;margin:10px 0 20px}.bar{height:100%;width:5%;background:#172033}
.result{display:none;background:#fff;border-radius:18px;border:1px solid #dfe4ec;padding:25px;text-align:center}.score{font-size:44px;font-weight:900}.negative{color:#b42318}.rules{font-size:13px;color:#697386}
@media(max-width:600px){.q{font-size:17px}.timer{font-size:18px}}
</style>
</head>
<body>
<header>
  <div class="brand">B.S. RAO <small>GOLDEN 10™</small></div>
  <div id="timer" class="timer">45:00</div>
</header>
<main>
<section class="info">
<h1>CBSE + IIT FOUNDATION MOCK TEST</h1>
<p><b>20 Questions • 80 Marks • 45 Minutes</b></p>
<p>Mathematics: 10 &nbsp; | &nbsp; Physics: 5 &nbsp; | &nbsp; Chemistry: 5</p>
<p>Correct +4 &nbsp; • &nbsp; Incorrect −1 &nbsp; • &nbsp; Unattempted 0</p>
</section>

<div class="subject-tabs">
<button class="tab active">Mathematics 10</button>
<button class="tab">Physics 5</button>
<button class="tab">Chemistry 5</button>
</div>

<div class="progress"><div id="bar" class="bar"></div></div>
<div id="question"></div>

<div class="nav">
<button id="prev" class="btn prev">← Previous</button>
<button id="next" class="btn next">Next →</button>
<button id="submit" class="btn submit">Submit Test</button>
</div>

<div id="result" class="result"></div>
</main>

<script>
const questions = [{"id": 1, "subject": "Mathematics", "question": "Demo Mathematics Question 1 — replace this with the final question-bank question.", "options": ["Option A", "Option B", "Option C", "Option D"], "answer": 0}, {"id": 2, "subject": "Mathematics", "question": "Demo Mathematics Question 2 — replace this with the final question-bank question.", "options": ["Option A", "Option B", "Option C", "Option D"], "answer": 0}, {"id": 3, "subject": "Mathematics", "question": "Demo Mathematics Question 3 — replace this with the final question-bank question.", "options": ["Option A", "Option B", "Option C", "Option D"], "answer": 0}, {"id": 4, "subject": "Mathematics", "question": "Demo Mathematics Question 4 — replace this with the final question-bank question.", "options": ["Option A", "Option B", "Option C", "Option D"], "answer": 0}, {"id": 5, "subject": "Mathematics", "question": "Demo Mathematics Question 5 — replace this with the final question-bank question.", "options": ["Option A", "Option B", "Option C", "Option D"], "answer": 0}, {"id": 6, "subject": "Mathematics", "question": "Demo Mathematics Question 6 — replace this with the final question-bank question.", "options": ["Option A", "Option B", "Option C", "Option D"], "answer": 0}, {"id": 7, "subject": "Mathematics", "question": "Demo Mathematics Question 7 — replace this with the final question-bank question.", "options": ["Option A", "Option B", "Option C", "Option D"], "answer": 0}, {"id": 8, "subject": "Mathematics", "question": "Demo Mathematics Question 8 — replace this with the final question-bank question.", "options": ["Option A", "Option B", "Option C", "Option D"], "answer": 0}, {"id": 9, "subject": "Mathematics", "question": "Demo Mathematics Question 9 — replace this with the final question-bank question.", "options": ["Option A", "Option B", "Option C", "Option D"], "answer": 0}, {"id": 10, "subject": "Mathematics", "question": "Demo Mathematics Question 10 — replace this with the final question-bank question.", "options": ["Option A", "Option B", "Option C", "Option D"], "answer": 0}, {"id": 11, "subject": "Physics", "question": "Demo Physics Question 11 — replace this with the final question-bank question.", "options": ["Option A", "Option B", "Option C", "Option D"], "answer": 0}, {"id": 12, "subject": "Physics", "question": "Demo Physics Question 12 — replace this with the final question-bank question.", "options": ["Option A", "Option B", "Option C", "Option D"], "answer": 0}, {"id": 13, "subject": "Physics", "question": "Demo Physics Question 13 — replace this with the final question-bank question.", "options": ["Option A", "Option B", "Option C", "Option D"], "answer": 0}, {"id": 14, "subject": "Physics", "question": "Demo Physics Question 14 — replace this with the final question-bank question.", "options": ["Option A", "Option B", "Option C", "Option D"], "answer": 0}, {"id": 15, "subject": "Physics", "question": "Demo Physics Question 15 — replace this with the final question-bank question.", "options": ["Option A", "Option B", "Option C", "Option D"], "answer": 0}, {"id": 16, "subject": "Chemistry", "question": "Demo Chemistry Question 16 — replace this with the final question-bank question.", "options": ["Option A", "Option B", "Option C", "Option D"], "answer": 0}, {"id": 17, "subject": "Chemistry", "question": "Demo Chemistry Question 17 — replace this with the final question-bank question.", "options": ["Option A", "Option B", "Option C", "Option D"], "answer": 0}, {"id": 18, "subject": "Chemistry", "question": "Demo Chemistry Question 18 — replace this with the final question-bank question.", "options": ["Option A", "Option B", "Option C", "Option D"], "answer": 0}, {"id": 19, "subject": "Chemistry", "question": "Demo Chemistry Question 19 — replace this with the final question-bank question.", "options": ["Option A", "Option B", "Option C", "Option D"], "answer": 0}, {"id": 20, "subject": "Chemistry", "question": "Demo Chemistry Question 20 — replace this with the final question-bank question.", "options": ["Option A", "Option B", "Option C", "Option D"], "answer": 0}];
let current=0, answers=Array(questions.length).fill(null), time=45*60, submitted=false;

function render(){
 const q=questions[current];
 document.getElementById("bar").style.width=((current+1)/questions.length*100)+"%";
 document.getElementById("question").innerHTML=`
 <div class="card">
  <div class="meta">Question ${current+1} of ${questions.length} • ${q.subject}</div>
  <div class="q">${q.question}</div>
  ${q.options.map((o,i)=>`<button class="option ${answers[current]===i?'selected':''}" onclick="selectOption(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}
 </div>`;
 document.getElementById("prev").style.visibility=current===0?"hidden":"visible";
 document.getElementById("next").style.display=current===questions.length-1?"none":"inline-block";
 document.getElementById("submit").style.display=current===questions.length-1?"inline-block":"none";
}
function selectOption(i){answers[current]=i;render()}
document.getElementById("prev").onclick=()=>{if(current>0){current--;render()}};
document.getElementById("next").onclick=()=>{if(current<questions.length-1){current++;render()}};
document.getElementById("submit").onclick=submitTest;

function submitTest(){
 if(submitted)return;
 submitted=true;
 let correct=0,wrong=0,unattempt=0;
 questions.forEach((q,i)=>{
   if(answers[i]===null) unattempt++;
   else if(answers[i]===q.answer) correct++;
   else wrong++;
 });
 const score=correct*4-wrong;
 const max=questions.length*4;
 const pct=(score/max*100).toFixed(2);
 document.getElementById("question").style.display="none";
 document.querySelector(".nav").style.display="none";
 const r=document.getElementById("result");
 r.style.display="block";
 r.innerHTML=`<div class="meta">TEST COMPLETED</div>
 <div class="score">${score}/${max}</div>
 <p><b>Percentage: ${pct}%</b></p>
 <p>Correct: ${correct} × 4 = ${correct*4}</p>
 <p>Incorrect: ${wrong} × −1 = <span class="negative">−${wrong}</span></p>
 <p>Unattempted: ${unattempt} × 0 = 0</p>
 <hr><p class="rules">Scoring: +4 correct • −1 incorrect • 0 unattempted</p>`;
}
function tick(){
 if(submitted)return;
 const m=Math.floor(time/60),s=time%60;
 document.getElementById("timer").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
 if(time<=0){submitTest();return}
 time--;
}
setInterval(tick,1000);tick();render();
</script>
</body>
</html>
