<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B.S. RAO GOLDEN 10™ | Class 10 Master Mock Test</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#172033}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;z-index:5}.brand{font-weight:800}.brand small{display:block;color:#697386;font-weight:500;letter-spacing:1px}.timer{font-weight:900;font-size:21px;color:#b42318}
main{max-width:850px;margin:auto;padding:22px 4% 50px}.info{background:#172033;color:#fff;border-radius:18px;padding:20px;margin-bottom:16px}.info h1{margin:0 0 10px;font-size:22px}.info p{margin:5px 0;color:#dce2ec}
.breakdown{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.pill{background:#fff;border:1px solid #ccd3df;border-radius:20px;padding:8px 13px;font-weight:800}.progress{height:9px;background:#dfe4ec;border-radius:10px;overflow:hidden;margin:14px 0 20px}.bar{height:100%;width:5%;background:#172033;transition:.2s}
.card{background:#fff;border:1px solid #e0e4eb;border-radius:18px;padding:22px}.meta{color:#697386;font-size:13px;font-weight:800;margin-bottom:10px}.q{font-size:19px;font-weight:700;line-height:1.5;margin-bottom:18px}.option{display:block;width:100%;text-align:left;border:1px solid #d5dbe5;background:#fff;border-radius:12px;padding:14px;margin:9px 0;font-size:16px;cursor:pointer}.option.selected{background:#edf2ff;border-color:#172033}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:800;cursor:pointer}.prev{background:#e8ecf2}.next,.submit{background:#172033;color:#fff}.submit{display:none;background:#087443}.result{display:none;background:#fff;border-radius:18px;border:1px solid #dfe4ec;padding:25px;margin-top:18px}.score{text-align:center;font-size:46px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.stat{padding:15px;background:#f6f8fb;border-radius:12px}.negative{color:#b42318}.subjectResult{margin-top:20px}.subjectRow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e5e8ef}
@media(max-width:600px){.q{font-size:17px}.grid{grid-template-columns:1fr}.timer{font-size:18px}}
</style>
</head>
<body>
<header><div class="brand">B.S. RAO <small>GOLDEN 10™ • CLASS 10</small></div><div id="timer" class="timer">45:00</div></header>
<main>
<section class="info">
<h1>CLASS 10 • MASTER MOCK TEST</h1>
<p><b>20 Questions • 80 Marks • 45 Minutes</b></p>
<p>Original CBSE-aligned + IIT Foundation reasoning questions</p>
<div class="breakdown"><span class="pill">Mathematics 10</span><span class="pill">Physics 5</span><span class="pill">Chemistry 5</span></div>
<p>Correct <b>+4</b> &nbsp; • &nbsp; Incorrect <b>−1</b> &nbsp; • &nbsp; Unattempted <b>0</b></p>
</section>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="question"></div>
<div class="nav"><button id="prev" class="btn prev">← Previous</button><button id="next" class="btn next">Next →</button><button id="submit" class="btn submit">Submit Test</button></div>
<div id="result" class="result"></div>
</main>
<script>
const questions = [{"id": 1, "subject": "Mathematics", "chapter": "Real Numbers", "question": "Using Euclid’s division algorithm, the HCF of 867 and 255 is:", "options": ["3", "17", "51", "102"], "answer": 2}, {"id": 2, "subject": "Mathematics", "chapter": "Polynomials", "question": "If the zeroes of x² − 7x + 10 are α and β, then α² + β² equals:", "options": ["19", "29", "39", "49"], "answer": 1}, {"id": 3, "subject": "Mathematics", "chapter": "Pair of Linear Equations", "question": "For the equations 2x + 3y = 7 and 4x + 6y = k to have infinitely many solutions, k must be:", "options": ["7", "10", "14", "21"], "answer": 2}, {"id": 4, "subject": "Mathematics", "chapter": "Quadratic Equations", "question": "The equation x² − 6x + 5 = 0 has roots whose product is:", "options": ["−5", "1", "5", "6"], "answer": 2}, {"id": 5, "subject": "Mathematics", "chapter": "Arithmetic Progressions", "question": "In the AP 5, 9, 13, …, which term is 81?", "options": ["18th", "19th", "20th", "21st"], "answer": 1}, {"id": 6, "subject": "Mathematics", "chapter": "Triangles", "question": "In ΔABC, DE ∥ BC with D on AB and E on AC. If AD:DB = 2:3, then AE:EC is:", "options": ["2:3", "3:2", "2:5", "5:2"], "answer": 0}, {"id": 7, "subject": "Mathematics", "chapter": "Coordinate Geometry", "question": "The distance between P(−2, 3) and Q(4, −5) is:", "options": ["8", "10", "√52", "√100"], "answer": 1}, {"id": 8, "subject": "Mathematics", "chapter": "Introduction to Trigonometry", "question": "If tan θ = 3/4 for an acute angle θ, then sin θ + cos θ is:", "options": ["1", "7/5", "1/5", "5/7"], "answer": 1}, {"id": 9, "subject": "Mathematics", "chapter": "Circles", "question": "From an external point P, tangents PA and PB are drawn to a circle. If PA = 8 cm, then PB is:", "options": ["4 cm", "8 cm", "16 cm", "Cannot be determined"], "answer": 1}, {"id": 10, "subject": "Mathematics", "chapter": "Statistics", "question": "The mean of five numbers is 18. If four of them are 12, 15, 20 and 21, the fifth number is:", "options": ["20", "22", "24", "25"], "answer": 2}, {"id": 11, "subject": "Physics", "chapter": "Light – Reflection and Refraction", "question": "A convex lens has focal length 20 cm. Its power is:", "options": ["+0.05 D", "+5 D", "−5 D", "+20 D"], "answer": 1}, {"id": 12, "subject": "Physics", "chapter": "Light – Reflection and Refraction", "question": "An object is placed beyond 2F of a convex lens. The image formed is generally:", "options": ["Virtual, erect and magnified", "Real, inverted and diminished", "Real, erect and same size", "Virtual, inverted and diminished"], "answer": 1}, {"id": 13, "subject": "Physics", "chapter": "Electricity", "question": "A 6 Ω resistor is connected across a 12 V source. The current through it is:", "options": ["0.5 A", "2 A", "6 A", "72 A"], "answer": 1}, {"id": 14, "subject": "Physics", "chapter": "Electricity", "question": "Two resistors of 4 Ω and 6 Ω are connected in series. Their equivalent resistance is:", "options": ["2.4 Ω", "4 Ω", "10 Ω", "24 Ω"], "answer": 2}, {"id": 15, "subject": "Physics", "chapter": "Magnetic Effects of Electric Current", "question": "The rule used to determine the direction of the magnetic field around a straight current-carrying conductor is:", "options": ["Fleming’s left-hand rule", "Fleming’s right-hand rule", "Right-hand thumb rule", "Lenz’s law"], "answer": 2}, {"id": 16, "subject": "Chemistry", "chapter": "Chemical Reactions and Equations", "question": "Which type of reaction is represented by: CaO + H₂O → Ca(OH)₂?", "options": ["Decomposition", "Combination", "Displacement", "Double displacement"], "answer": 1}, {"id": 17, "subject": "Chemistry", "chapter": "Acids, Bases and Salts", "question": "A solution has pH 2. Compared with a solution of pH 5, it has:", "options": ["Lower H⁺ concentration", "Higher H⁺ concentration", "Equal H⁺ concentration", "No H⁺ ions"], "answer": 1}, {"id": 18, "subject": "Chemistry", "chapter": "Metals and Non-metals", "question": "Which property generally allows metals to be drawn into wires?", "options": ["Malleability", "Ductility", "Sonority", "Brittleness"], "answer": 1}, {"id": 19, "subject": "Chemistry", "chapter": "Carbon and its Compounds", "question": "The functional group present in ethanol is:", "options": ["−COOH", "−CHO", "−OH", "−CO−"], "answer": 2}, {"id": 20, "subject": "Chemistry", "chapter": "Carbon and its Compounds", "question": "Which hydrocarbon is saturated?", "options": ["C₂H₄", "C₃H₆", "C₄H₈", "C₃H₈"], "answer": 3}];
let current=0,answers=Array(questions.length).fill(null),time=2700,submitted=false;
function render(){const q=questions[current];document.getElementById("bar").style.width=((current+1)/20*100)+"%";document.getElementById("question").innerHTML=`<div class="card"><div class="meta">Question ${current+1} of 20 • ${q.subject} • ${q.chapter}</div><div class="q">${q.question}</div>${q.options.map((o,i)=>`<button class="option ${answers[current]===i?'selected':''}" onclick="selectOption(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div>`;document.getElementById("prev").style.visibility=current===0?"hidden":"visible";document.getElementById("next").style.display=current===19?"none":"inline-block";document.getElementById("submit").style.display=current===19?"inline-block":"none"}
function selectOption(i){answers[current]=i;render()}
prev.onclick=()=>{if(current>0){current--;render()}};next.onclick=()=>{if(current<19){current++;render()}};submit.onclick=submitTest;
function submitTest(){if(submitted)return;submitted=true;let c=0,w=0,u=0,by={Mathematics:[0,0,0],Physics:[0,0,0],Chemistry:[0,0,0]};questions.forEach((q,i)=>{if(answers[i]===null){u++;by[q.subject][2]++}else if(answers[i]===q.answer){c++;by[q.subject][0]++}else{w++;by[q.subject][1]++}});let score=c*4-w,pct=(score/80*100).toFixed(2);document.getElementById("question").style.display="none";document.querySelector(".nav").style.display="none";const r=document.getElementById("result");r.style.display="block";r.innerHTML=`<div class="meta">TEST COMPLETED</div><div class="score">${score}/80</div><p style="text-align:center"><b>${pct}%</b></p><div class="grid"><div class="stat">Correct<br><b>${c} × 4 = ${c*4}</b></div><div class="stat">Incorrect<br><b class="negative">${w} × −1 = −${w}</b></div><div class="stat">Unattempted<br><b>${u} × 0 = 0</b></div><div class="stat">Attempted<br><b>${c+w}/20</b></div></div><div class="subjectResult"><h3>Subject-wise Analysis</h3>${Object.entries(by).map(([s,v])=>`<div class="subjectRow"><b>${s}</b><span>${v[0]} correct • ${v[1]} wrong • ${v[2]} unattempted</span></div>`).join("")}</div>`}
function tick(){if(submitted)return;let m=Math.floor(time/60),s=time%60;document.getElementById("timer").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");if(time<=0){submitTest();return}time--}setInterval(tick,1000);tick();render();
</script>
</body></html>
