let stage="Foundation — KNOW", current=0, answers=[], time=2700, submitted=false;
function loadStage(s){stage=s;current=0;answers=Array(20).fill(null);time=2700;submitted=false;document.getElementById("question").style.display="block";document.querySelector(".nav").style.display="flex";document.getElementById("result").style.display="none";document.querySelectorAll(".stage").forEach(b=>b.classList.toggle("active",b.dataset.stage===stage));render();tick();}
