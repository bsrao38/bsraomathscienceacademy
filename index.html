function start(si){stage=si;let src=BANKS[level]&&BANKS[level][STAGES[si][0]];if(cls!=="10"||!src){alert("This class/level is connected to the same master navigation. Its question bank is not loaded yet.");return}if(si===3){let all=[...(BANKS[level]["Foundation — KNOW"]||[]),...(BANKS[level]["Logical — THINK"]||[]),...(BANKS[level]["Elite — MASTER"]||[])];src=all.filter((_,i)=>i%3===0).slice(0,20)}if(!src||src.length<20){alert("Question bank is not ready for this stage.");return}questions=src.slice(0,20);answers=Array(20).fill(null);qi=0;remaining=2700;done=false;clearInterval(timer);renderTest();timer=setInterval(tick,1000)}
function renderTest(){home(false);let q=questions[qi];put(`<main class="container"><div class="testTop"><div><b>LEVEL ${level} • ${STAGES[stage][0]}</b><div style="opacity:.75;margin-top:5px">${C10[level]}</div></div><div id="tm" class="timer">45:00</div></div><div class="crumb">Question ${qi+1} of 20 • ${q.subject}</div><section class="qcard"><div class="qmeta">${q.chapter}</div><div class="qtext">${q.question}</div>${q.options.map((o,i)=>`<button class="opt ${answers[qi]===i?"sel":""}" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</section><div class="testnav"><button class="btn secondary" onclick="prev()">← Previous</button><button class="btn primary" onclick="${qi===19?"submitTest()":"next()"}">${qi===19?"Submit Test":"Next →"}</button></div></main>`)}
function pick(i){answers[qi]=i;renderTest()}function prev(){if(qi>0){qi--;renderTest()}}function next(){if(qi<19){qi++;renderTest()}}function tick(){if(done)return;remaining--;let t=document.getElementById("tm");if(t)t.textContent=String(Math.floor(remaining/60)).padStart(2,"0")+":"+String(remaining%60).padStart(2,"0");if(remaining<=0)submitTest()}
function submitTest(){if(done)return;done=true;clearInterval(timer);let c=0,w=0,u=0,by={"Mathematics":[0,0,0],"Physics":[0,0,0],"Chemistry":[0,0,0]};questions.forEach((q,i)=>{if(answers[i]===null){u++;if(by[q.subject])by[q.subject][2]++}else if(answers[i]===q.answer){c++;if(by[q.subject])by[q.subject][0]++}else{w++;if(by[q.subject])by[q.subject][1]++}});let score=c*4-w,p=(score/80*100).toFixed(2);home(true);put(`<main class="container"><section class="result"><div class="crumb">TEST COMPLETED • CLASS ${cls} • LEVEL ${level}</div><h2 style="text-align:center">🏆 ${STAGES[stage][0]}</h2><div class="score">${score}/80</div><p style="text-align:center;font-size:19px"><b>${p}%</b></p><div class="stats"><div class="stat"><b>Correct</b><br>${c} × 4 = ${c*4}</div><div class="stat"><b>Wrong</b><br>${w} × −1 = −${w}</div><div class="stat"><b>Unattempted</b><br>${u}</div><div class="stat"><b>Attempted</b><br>${c+w}/20</div></div><h3>Subject-wise Analysis</h3>${Object.entries(by).map(([s,v])=>`<div class="subject"><b>${s}</b><span>${v[0]} correct • ${v[1]} wrong • ${v[2]} unattempted</span></div>`).join("")}<div class="actions" style="margin-top:20px"><button class="btn primary" onclick="stages('${level}')">Try Another Stage</button><button class="btn secondary" onclick="levels('${cls}')">All Levels</button></div></section></main>`)}
HB.onclick=()=>{if(student)dashboard()};login();
</script></body></html>
