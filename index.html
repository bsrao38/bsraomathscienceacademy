<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B.S. RAO GOLDEN 10™ Student Portal</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef6ff,#f8f5ff,#effcf5);color:#101828}
header{background:#fff;padding:16px 6%;display:flex;align-items:center;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}
.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#1769d5,#6541e8);color:#fff;display:grid;place-items:center;font-size:21px;font-weight:900;margin-right:12px}.brand{font-weight:900;font-size:20px}.gold{letter-spacing:3px;color:#667085;font-size:11px;margin-top:3px}
main{max-width:900px;margin:auto;padding:45px 6% 70px}.card{background:#fff;border:1px solid #dce4ef;border-radius:28px;padding:32px;box-shadow:0 20px 60px #10182818}.center{text-align:center}.heroTitle{font-size:52px;margin:20px 0 12px}.sub{font-size:19px;color:#667085;line-height:1.6}
input{width:100%;padding:17px;border:2px solid #d0d7e2;border-radius:14px;font-size:20px;margin:18px 0;text-align:center}button{border:0;border-radius:14px;padding:15px 20px;font-size:17px;font-weight:800;cursor:pointer}.primary{background:#1769d5;color:#fff;width:100%}.back{background:#edf2f7;color:#344054;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.tile{background:#fff;border:1px solid #dce4ef;border-radius:20px;padding:22px;text-align:left}.tile b{font-size:21px}.tile span{display:block;color:#667085;margin-top:7px}.error{color:#b42318;font-weight:800;min-height:25px;margin-top:3px}.ok{color:#087443;font-weight:800}.badge{display:inline-block;background:#e5f1ff;color:#1769d5;padding:8px 13px;border-radius:99px;font-weight:800}
footer{background:#101828;color:#fff;text-align:center;padding:35px 6%}footer small{display:block;color:#98a2b3;margin-top:8px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.heroTitle{font-size:42px}.card{padding:24px}}
</style>
</head>
<body>
<header><div class="logo">BR</div><div><div class="brand">B.S. RAO</div><div class="gold">GOLDEN 10™</div></div></header>
<div id="app"></div>
<footer><b>B.S. RAO MATH & SCIENCE ACADEMY</b><small>Golden 10™ Mastery System • CBSE Classes 6–10</small></footer>

<script>
(function(){
const app=document.getElementById("app");

function login(){
app.innerHTML=`<main><section class="card center">
<span class="badge">CBSE • 6th–10th</span>
<h1 class="heroTitle">Student Portal</h1>
<p class="sub">Enter your Hall Ticket Number to enter your personalised mastery dashboard.</p>
<input id="hall" inputmode="numeric" maxlength="7" placeholder="HALL TICKET NUMBER" autocomplete="off">
<div id="err" class="error"></div>
<button class="primary" id="enter">Enter Academy →</button>
</section></main>`;
document.getElementById("enter").onclick=validate;
document.getElementById("hall").addEventListener("keydown",e=>{if(e.key==="Enter")validate()});
}
function validate(){
const input=document.getElementById("hall");
const n=input.value.trim();
if(!/^\d{7}$/.test(n)){
document.getElementById("err").textContent="Please enter the 7-digit Hall Ticket Number.";
return;
}
const num=Number(n);
if(num<3827001 || num>3827100){
document.getElementById("err").textContent="Invalid Hall Ticket Number.";
return;
}
dashboard(n);
}
function dashboard(ht){
app.innerHTML=`<main>
<section class="card">
<span class="badge">STUDENT VERIFIED ✓</span>
<h1>Welcome, Student</h1>
<p class="sub">Hall Ticket Number: <b>${ht}</b></p>
<p class="sub">Your B.S. RAO GOLDEN 10™ mastery portal is ready.</p>
<div class="actions" style="margin-top:24px"><button class="primary" onclick="classes()">🚀 ONLINE MOCK TEST</button></div>
</section>
<div class="grid" style="margin-top:18px">
<div class="tile"><b>🎯 200 Mock Tests</b><span>5 Classes × 10 Levels × 4 Stages</span></div>
<div class="tile"><b>🏆 Golden 10™</b><span>KNOW → THINK → MASTER → CHALLENGE</span></div>
<div class="tile"><b>📚 Study Notes</b><span>Concepts • Revision • Practice</span></div>
<div class="tile"><b>📊 Results</b><span>Score • Accuracy • Analysis</span></div>
</div>
</main>`;
}
function classes(){
app.innerHTML=`<main><button class="back" onclick="location.reload()">← Login</button><h1>Choose Your Class</h1><p class="sub">ONLINE MOCK TEST</p><div class="grid">${["6","7","8","9","10"].map(c=>`<button class="tile" onclick="levels('${c}')"><b>Class ${c}</b><span>CBSE • Golden 10™</span></button>`).join("")}</div></main>`;
}
const titles=["Number Mastery","Number Theory","Fractions & Decimals","Powers","Exponents & Algebra","Commercial Maths","Geometry","Mensuration","Advanced Foundation","CBSE Excellence"];
function levels(c){
app.innerHTML=`<main><button class="back" onclick="classes()">← Classes</button><h1>Class ${c} — Golden Levels</h1><div class="grid">${titles.map((t,i)=>`<button class="tile" onclick="stages('${c}',${i+1})"><span>LEVEL ${i+1}</span><b>${t}</b><span>Golden 10™ Mastery</span></button>`).join("")}</div></main>`;
}
function stages(c,l){
app.innerHTML=`<main><button class="back" onclick="levels('${c}')">← Levels</button><h1>Class ${c} • Level ${l}</h1><p class="sub">${titles[l-1]}</p><div class="grid">
<button class="tile" onclick="ready('${c}',${l},'Foundation — KNOW')"><b>📗 Foundation — KNOW</b><span>Concepts • Basic sums • Direct formulas</span></button>
<button class="tile" onclick="ready('${c}',${l},'Logical — THINK')"><b>🧠 Logical — THINK</b><span>Tricky questions • Applications • Connections</span></button>
<button class="tile" onclick="ready('${c}',${l},'Elite — MASTER')"><b>✨ Elite — MASTER</b><span>HOTS • Multi-step reasoning • Time challenge</span></button>
<button class="tile" onclick="ready('${c}',${l},'Master Challenge')"><b>🏆 Master Challenge</b><span>Mixed real-exam simulation</span></button>
</div></main>`;
}
function ready(c,l,s){
app.innerHTML=`<main><button class="back" onclick="stages('${c}',${l})">← Stages</button><section class="card center"><span class="badge">TEST READY</span><h1>Class ${c} • Level ${l}</h1><h2>${s}</h2><p class="sub">20 Questions • 80 Marks • 45 Minutes<br>Correct +4 • Wrong −1 • Unattempted 0</p><p class="ok">Navigation is working successfully.</p><button class="primary" onclick="alert('Question bank connection point is ready.')">Start Test →</button></section></main>`;
}
window.classes=classes;window.levels=levels;window.stages=stages;window.ready=ready;
login();
})();
</script>
</body>
</html>
